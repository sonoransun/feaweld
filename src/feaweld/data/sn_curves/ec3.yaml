# EN 1993-1-9 (Eurocode 3) fatigue detail categories -- direct stress ranges
# N = C / S^m two-slope curves:
#   m1 = 3 from the reference anchor (N = 2e6 cycles at delta_sigma_C, the
#   detail category in MPa) down to the constant-amplitude fatigue limit at
#   N_D = 5e6 cycles, where
#     delta_sigma_D = (2/5)^(1/3) * delta_sigma_C ~= 0.7368 * delta_sigma_C
#   m2 = 5 between N_D = 5e6 and the cut-off limit at N_L = 1e8, where
#     delta_sigma_L = (5/100)^(1/5) * delta_sigma_D ~= 0.4047 * delta_sigma_C

conventions:
  n_reference: 2.0e+6
  knee_cycles: 5.0e+6
  cutoff_cycles: 1.0e+8
  m1: 3
  m2: 5

categories: [36, 40, 45, 50, 56, 63, 71, 80, 90, 100, 112, 125, 140, 160]
