# Fillet welded T-joint under axial tension.
#
# Ready-made copy of the case walked through in docs/quickstart.md (section 3).
# Run it with:
#
#     feaweld run examples/fillet_t_joint.yaml
#
# Enum fields use the lowercase Pydantic values (joint_type, solver_type,
# stress_methods). Fields not listed fall back to the defaults defined on the
# models in feaweld.pipeline.workflow.

name: fillet_t_joint_example
description: Fillet welded T-joint under axial tension

material:
  base_metal: A36          # any key from `feaweld materials`
  weld_metal: E70XX
  haz: A36
  temperature: 20.0        # service temperature (°C)

geometry:
  joint_type: fillet_t     # fillet_t | butt | lap | corner | cruciform
  base_width: 200.0        # mm
  base_thickness: 20.0     # mm
  web_height: 100.0        # mm
  web_thickness: 10.0      # mm
  weld_leg_size: 8.0       # mm — fillet weld leg
  length: 1.0              # extrusion depth (mm); 1.0 = quasi-2D

mesh:
  global_size: 2.0         # mm — background element size
  weld_toe_size: 0.2       # mm — refinement at the weld toe
  element_order: 2         # 1 = linear, 2 = quadratic

solver:
  solver_type: linear_elastic  # linear_elastic | elastoplastic | thermal_steady | thermal_transient | thermomechanical | creep
  backend: auto                # auto | fenics | calculix

load:
  axial_force: 50000.0     # N

postprocess:
  stress_methods:          # nominal | hotspot_linear | hotspot_quadratic | structural_dong | notch_stress | strain_energy_density | linearization | blodgett
    - hotspot_linear
    - structural_dong
    - blodgett
  sn_curve: IIW_FAT90      # IIW_FAT*, DNV_*, or ASME_* curve name
  fatigue_assessment: true

output_dir: results/fillet_t_joint
